[project]
name = "bio-bandage-reproducibility"
version = "1.0.0"
description = "Reproducible synthetic computational package for an in-silico diclofenac cryocompression bandage study."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Mohanad A. Deif" },
  { name = "Ismail A. Elhaty" },
  { name = "Mohamed A. Hafez" },
  { name = "Mohammad Khishe" }
]
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "nbformat"
]

[tool.setuptools]
packages = ["src"]
